version: '3.8'

services:
  vox-protocol:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vox_protocol_studio
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - HEADLESS=true
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    restart: unless-stopped
